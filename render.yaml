services:
  # =====================================================================
  # Service A: element.i Backend (FastAPI + Playwright + Uvicorn)
  # Free tier web service with temporary local storage (data/ directory)
  # =====================================================================
  - type: web
    name: element-i-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python -m playwright install --with-deps chromium"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: data
      - key: DATABASE_URL
        value: sqlite:///data/code_apex.db
      - key: EVIDENCE_DIR
        value: data/evidence
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.ms-playwright
      - key: FRONTEND_ORIGIN
        value: https://element-i-frontend.onrender.com
      - key: SAMPLE_APP_URL
        value: https://code-apex-sample-app-v2.onrender.com/
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  # =====================================================================
  # Service B: element.i Frontend (Next.js 14 Dashboard)
  # Free tier web service connected to the backend public URL
  # =====================================================================
  - type: web
    name: element-i-frontend
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://element-i-backend.onrender.com
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
