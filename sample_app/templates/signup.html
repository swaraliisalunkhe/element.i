{% extends "base.html" %}

{% block title %}Create Account | Code Apex{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card" style="padding: 36px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon" style="margin: 0 auto 16px auto;">CA</div>
            <h1 style="font-size: 24px; font-weight: 800;">Create Candidate Account</h1>
            <p style="font-size: 14px; color: var(--text-secondary); margin-top: 6px;">
                Register to take enterprise online assessments.
            </p>
        </div>

        <form action="/signup" method="POST">
            <div style="margin-bottom: 16px;">
                <label for="email" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Work / Candidate Email</label>
                <input id="email" name="email" type="email" required
                       style="width: 100%; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: var(--radius-sm); font-size: 14px;">
            </div>

            <div style="margin-bottom: 16px;">
                <label for="password" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Password</label>
                <input id="password" name="password" type="password" required
                       style="width: 100%; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: var(--radius-sm); font-size: 14px;">
            </div>

            <div style="margin-bottom: 24px;">
                <label for="confirm_password" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password" required
                       style="width: 100%; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: var(--radius-sm); font-size: 14px;">
            </div>

            <button id="signup-btn" type="submit" class="btn btn-primary" style="width: 100%;">
                Create Account →
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 13px; text-align: center; color: var(--text-secondary);">
            Already registered? <a href="/login" style="color: var(--primary-orange); font-weight: 600;">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
