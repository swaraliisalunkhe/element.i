{% extends "base.html" %}

{% block title %}Reset Password | Code Apex{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card" style="padding: 36px;">
        <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Reset Password</h1>
        <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">
            Enter your registered email address to receive password reset instructions.
        </p>

        <form action="/reset-password" method="POST">
            <div style="margin-bottom: 20px;">
                <label for="email" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Email Address</label>
                <input id="email" name="email" type="email" required
                       style="width: 100%; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: var(--radius-sm); font-size: 14px;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Send Reset Link →
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13px;">
            <a href="/login" style="color: var(--primary-orange);">← Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
